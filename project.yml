name: WhelpBook
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
targets:
  WhelpBook:
    type: application
    platform: iOS
    sources:
      - path: WhelpBook
      - path: Shared
    dependencies:
      - target: WhelpBookWidget
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.whelp-book
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_ENTITLEMENTS: WhelpBook/WhelpBook.entitlements
    info:
      path: WhelpBook/Info.plist
      properties:
        CFBundleDisplayName: Whelp Book
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        # PhotoField needs these. Say what the photo is actually for; Apple rejects vague strings.
        NSCameraUsageDescription: Take a photo of a dam or a puppy to keep on its record.
        NSPhotoLibraryUsageDescription: Choose a photo of a dam or a puppy to keep on its record.
        ITSAppUsesNonExemptEncryption: false
  WhelpBookWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: WhelpBookWidget
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.whelp-book.widget
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_ENTITLEMENTS: WhelpBookWidget/WhelpBookWidget.entitlements
        SKIP_INSTALL: YES
    info:
      path: WhelpBookWidget/Info.plist
      properties:
        CFBundleDisplayName: Whelp Book Widget
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
  WhelpBookTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: WhelpBookTests
    dependencies:
      - target: WhelpBook
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.whelp-book.tests
        GENERATE_INFOPLIST_FILE: YES
  WhelpBookUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: WhelpBookUITests
    dependencies:
      - target: WhelpBook
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.whelp-book.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: WhelpBook
schemes:
  WhelpBook:
    build:
      targets:
        WhelpBook: all
        WhelpBookTests: [test]
        WhelpBookUITests: [test]
    run:
      config: Debug
      storeKitConfiguration: WhelpBook/StoreKit/Products.storekit
    test:
      config: Debug
      storeKitConfiguration: WhelpBook/StoreKit/Products.storekit
      targets:
        - WhelpBookTests
        - WhelpBookUITests
    archive:
      config: Release
